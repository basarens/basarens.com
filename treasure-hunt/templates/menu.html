{% extends "base.html" %}

{% block title %}Menu{% endblock %}

{% block content %}
<div id="menu-container">
    <!-- Flickering Title -->
    <h1 id="menu-title" onclick="showMenu()">Menu</h1>

    <!-- Buttons (Initially Hidden) -->
    <div id="menu-buttons">
        <button onclick="location.href='/intro'">New Game</button>
        <button onclick="location.href='/dedicatedto'">Dedicated To</button>
        <button onclick="location.href='/credits'">Credits</button>
    </div>

    <!-- Background Music -->
    <audio id="background-music" loop>
        <source src="{{ url_for('static', filename='background-music/menu.mp3') }}" type="audio/mpeg">
        Your browser does not support the audio element.
    </audio>
</div>

<style>
    /* Menu Container */
    #menu-container {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        height: 100vh;
        width: 100%;
        background-color: black;
        color: white;
    }

    /* Flickering Title */
    #menu-title {
        font-family: 'Press Start 2P', cursive;
        font-size: 3rem;
        animation: flicker 1.5s infinite;
        cursor: pointer;
    }

    @keyframes flicker {
        0%, 100% {
            opacity: 1;
        }
        50% {
            opacity: 0.3;
        }
    }

    /* Buttons (Initially Hidden) */
    #menu-buttons {
        display: none; /* Hidden initially */
        flex-direction: column;
        gap: 15px;
        margin-top: 20px;
    }

    #menu-buttons button {
        padding: 10px 20px;
        font-size: 1rem;
        font-family: 'Press Start 2P', cursive;
        background-color: white;
        color: black;
        border: none;
        cursor: pointer;
        transition: background-color 0.3s ease, opacity 1s ease;
        opacity: 0; /* Invisible initially */
    }

    #menu-buttons button:hover {
        background-color: gray;
        color: white;
    }

    /* Fade-in animation */
    .fade-in {
        animation: fade-in 1s forwards;
    }

    @keyframes fade-in {
        from {
            opacity: 0;
        }
        to {
            opacity: 1;
        }
    }
</style>

<script>
    // Show menu buttons and play background music
    function showMenu() {
        const title = document.getElementById("menu-title");
        const buttons = document.getElementById("menu-buttons");
        const audio = document.getElementById("background-music");

        // Hide title after click
        title.style.display = "none";

        // Fade in buttons
        buttons.style.display = "flex";
        const buttonElements = buttons.querySelectorAll("button");
        buttonElements.forEach((button, index) => {
            setTimeout(() => {
                button.classList.add("fade-in");
            }, index * 500); // Staggered fade-in for buttons
        });

        // Play background music
        audio.play();
    }
</script>
{% endblock %}
